name: Build and deploy the user interface to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - user-interface/**

concurrency:
  group: build-and-deploy
  cancel-in-progress: true
      
jobs:
  build:
    defaults:
      run:
        working-directory: user-interface/
    
    runs-on: ubuntu-latest
    
    env:
      build_path: build/user-interface/browser/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: user-interface/package-lock.json
      - run: npm ci
      - run: npm run build -- --base-href=/${{ github.event.repository.name }}/
      - run: |
          cd ../${{ env.build_path }}/
          cp index.html 404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.build_path }}

  deploy:
    needs: build
        
    permissions:
      pages: write
      id-token: write
        
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
