@if (store.state().groups.length >= 2) {
	<app-groups-graph [state]="store.state()" (groupClick)="selectedGroupIds.set([$event.id])" animate.enter="enter" animate.leave="leave" />
}
<section>
	<div>
		<div>
			<button mat-raised-button (click)="addNewGroup()">Ajouter <mat-icon>add</mat-icon></button>
			<button mat-raised-button (click)="deleteGroup()" [disabled]="selectedGroupIds().length === 0">Supprimer <mat-icon>remove</mat-icon></button>
		</div>
		<mat-selection-list
			[multiple]="false" [(ngModel)]="selectedGroupIds"
			cdkDropList (cdkDropListDropped)="onDrop($event)"
			(paste)="onPaste($event)"
			(keydown)="onKeydown($event)"
		>
			@for (group of store.state().groups; track group.id) {
				<mat-list-option cdkDrag [value]="group.id" [appCopyData]="group.toHumanJson(store.state())" appCopyType="group" appEnterLeaveAnimation="fade">
					{{group.name}}
				</mat-list-option>
			}
		</mat-selection-list>
	</div>
	
	@if (selectedGroupIds().length > 0) {
		<app-group-form [group]="store.state().findId('groups', selectedGroupIds()[0])!" appEnterLeaveAnimation="slide" />
	}
</section>
